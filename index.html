          data-x="108"
          data-y="748"

          data-h="92"

          <span class="school-lightshow" aria-hidden="true">
            <svg class="school-lightshow-svg" viewBox="0 0 620 120" focusable="false" aria-hidden="true">
              <defs>
                <filter id="school-drone-glow" x="-80%" y="-80%" width="260%" height="260%">
                  <feGaussianBlur stdDeviation="2.6" result="blur" />
                  <feColorMatrix
                    in="blur"
                    result="droneGlow"
                    type="matrix"
                    values="1 0 0 0 0.42 0 1 0 0 0.52 0 0 1 0 1 0 0 0 0.92 0"
                  />
                  <feMerge>
                    <feMergeNode in="droneGlow" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
              </defs>
              <rect class="lightshow-sky" x="0" y="0" width="620" height="120" rx="12" />
              <g class="drone-flight-lines" aria-hidden="true">
                <path class="drone-flight-line drone-flight-line-one" d="M18 96 C126 24 238 18 322 47 C414 78 495 38 602 18" />
                <path class="drone-flight-line drone-flight-line-two" d="M598 102 C466 60 354 92 282 78 C180 58 108 86 24 104" />
              </g>
              <g class="school-drone-show" data-drone-show filter="url(#school-drone-glow)"></g>
            </svg>
          </span>
          <span class="school-firework school-firework-one" aria-hidden="true"></span>
          <span class="school-firework school-firework-two" aria-hidden="true"></span>
          <span class="school-firework school-firework-three" aria-hidden="true"></span>
